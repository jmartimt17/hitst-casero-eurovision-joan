<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hitster Eurovisión 2024 — Cartas para imprimir</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      font-family: 'Inter', sans-serif;
      padding: 2rem;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: #f0eeff;
      font-size: 2rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.3rem;
    }

    .subtitle { color: #8880aa; font-size: 0.85rem; margin-bottom: 2rem; }

    .instructions {
      background: #13132a;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 1rem 1.4rem;
      color: #c0b8ee;
      font-size: 0.82rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      max-width: 700px;
    }
    .instructions strong { color: #f0c040; }

    .btn-print {
      display: inline-block;
      background: #5040ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 2rem;
    }
    .btn-print:hover { opacity: 0.85; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 200px);
      gap: 1.2rem;
    }

    .card {
      background: #0a0a14;
      border: 2px solid #2a2a4a;
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: #f0eeff;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #5040ff, #f0c040);
    }

    .card-year {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #8880aa;
      text-transform: uppercase;
    }

    .card-flag  { font-size: 2rem; }

    .card-country {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.06em;
      color: #f0c040;
      text-align: center;
    }

    .card-title {
      font-size: 0.7rem;
      color: #c0b8ee;
      text-align: center;
      font-weight: 600;
      line-height: 1.3;
    }

    .card-artist {
      font-size: 0.65rem;
      color: #8880aa;
      text-align: center;
    }

    .qr-container {
      background: white;
      border-radius: 8px;
      padding: 6px;
      margin-top: 0.3rem;
    }

    .card-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: #2a2a4a;
      margin-top: 0.2rem;
    }

    @media print {
      body { background: white; padding: 0.5cm; }
      h1, .subtitle, .instructions, .btn-print { display: none; }
      .grid { grid-template-columns: repeat(4, 1fr); gap: 0.4cm; }
      .card {
        background: white;
        border: 1.5px solid #ccc;
        border-radius: 10px;
        break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .card::before { background: linear-gradient(90deg, #5040ff, #f0c040); }
      .card-country { color: #c09010; }
      .card-title   { color: #333; }
      .card-artist  { color: #666; }
      .card-logo    { color: #ccc; }
    }
  </style>
</head>
<body>

<h1>🎵 HITSTER EUROVISIÓN 2024</h1>
<p class="subtitle">26 cartas · Gran Final · Malmö, Suecia</p>

<div class="instructions">
  <strong>Cómo usar:</strong> Los QR ya apuntan a tu web. Pulsa "Imprimir cartas", recórtalas y ¡a jugar!<br><br>
  <strong>Para jugar:</strong> Escanea el QR → pulsa "Abrir en Spotify" → dale play → pulsa "Iniciar" → ¡adivina el año del Festival!
</div>

<button class="btn-print" onclick="window.print()">🖨️ Imprimir cartas</button>

<div class="grid" id="grid"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

const grid = document.getElementById('grid');

SONGS.forEach(song => {
  const url  = `${BASE_URL}?id=${song.id}`;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-year">EUROVISIÓN 2024</div>
    <div class="card-flag">${song.flag}</div>
    <div class="card-country">${song.country.toUpperCase()}</div>
    <div class="card-title">${song.title}</div>
    <div class="card-artist">${song.artist}</div>
    <div class="qr-container" id="qr-${song.id}"></div>
    <div class="card-logo">HITSTER · EUROVISIÓN</div>
  `;
  grid.appendChild(card);

  new QRCode(document.getElementById(`qr-${song.id}`), {
    text: url,
    width: 110,
    height: 110,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
});
</script>
</body>
</html>
